[workspace]
resolver = "2"
members = [
    "crates/frost",
    "crates/frost-ffi",
    "crates/signer",
    "crates/relay",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/cdrn/vouch"
rust-version = "1.80"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
